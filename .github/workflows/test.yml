name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - name: Install
      run: npm ci
    - name: Test grammar scopes
      run: npm test
    - name: Test command helpers
      run: |
        bash -n Support/lib/rails_commands.sh
        ruby test/commands/model_generator_args_test.rb
        ruby test/commands/rails_navigator_test.rb
        ruby test/commands/editing_commands_test.rb
